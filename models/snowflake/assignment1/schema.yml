version: 2

models:
  - name: stg_claims
    columns:
      - name: claim_id
        data_tests:
          - unique
          - not_null

  - name: stg_providers
    columns:
      - name: provider_id
        data_tests:
          - unique
          - not_null

  - name: stg_member_enrollment
    columns:
      - name: member_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments: # available in v1.10.5 and higher. Older versions can set the <argument_name> as the top-level property.
                values: ['cancelled']
      